<!DOCTYPE html>
<html>
<head>
    <title>Date Form</title>

    <style>
        .form {
            width: 180px;
            margin: auto;
            border: 1px solid #9bb8d5;
            padding: 10px;
        }

        label {
            display: block;
            margin-top: 8px;
        }

        input {
            margin-top: 5px;
        }

        .submit {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="form">

    <form>

        <label>
            Name:
        </label>

        <input type="text">


        <label>
            Telephone Number:
        </label>

        <input type="tel">


        <label>
            Email:
        </label>

        <input type="email">


        <label>
            Favorite Color:
        </label>

        <input type="color">


        <label>
            Date of Birth:
        </label>

        <input type="date">


        <div class="submit">
            <input type="submit" value="Submit">
        </div>

    </form>

</div>

</body>
</html>
